# Typecheck, test and build every workspace on push to main.
#
# Deliberately not `pull_request`: that trigger fires on every push to any
# branch that has a pull request open, which is what made CI run off main at
# all — and it checked each change twice, once on the pull request's head and
# again on the merge commit. `workflow_dispatch` stays so a branch can still be
# checked on demand from the Actions tab.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The other workspaces import the shared package's built types.
      - run: npm run build --workspace @kvitto/shared

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
