# Typecheck, test and build every workspace on push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The other workspaces import the shared package's built types.
      - run: npm run build --workspace @kvitto/shared

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
