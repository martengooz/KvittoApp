# Self-hosting KvittoApp: one container serving both the PWA and the sync API.
#
#   cp apps/server/.env.example .env   # then edit
#   docker compose up -d --build
#
# Open http://localhost:8787/server to create a pairing code for the app.

services:
  kvitto:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: kvittoapp:latest
    restart: unless-stopped
    ports:
      - '8787:8787'
    volumes:
      # Receipts and images live here. This is the directory to back up.
      - kvitto-data:/data
    environment:
      # Uncomment and set to your real origin before exposing this publicly.
      # KVITTO_CORS_ORIGINS: https://kvitto.example.com
      KVITTO_TRUST_PROXY: 'false'
      LOG_LEVEL: info
    env_file:
      - path: .env
        required: false

volumes:
  kvitto-data:
